<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
</head>
<body>
    <h1>Список книг в библиотеке</h1>
    <ul>
        {% for book in books %}
            <li><strong>{{ book.title }}</strong> — {{ book.author }} (Страниц: {{ book.pages }}, Дата публикации: {{ book.published }})</li>
        {% empty %}
            <li>Книг пока нет.</li>
        {% endfor %}
    </ul>
</body>
</html>
